<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rumbo — Travel Dashboard & Trip Organizer</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #161a22;
      --card-border: #262c3a;
      --accent-coral: #ff5e57;
      --accent-teal: #00d2d3;
      --accent-amber: #ff9f43;
      --accent-purple: #5f27cd;
      --text-main: #f1f2f6;
      --text-muted: #8c9baf;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.5;
      padding-bottom: 80px;
    }

    /* Sticky Navigation Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 15, 18, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 20px;
    }

    .nav-container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-coral);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.5px;
      cursor: pointer;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lang-btn, .mode-btn, .back-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .lang-btn:hover, .mode-btn:hover, .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-teal);
    }

    /* Dashboard Layout */
    .dashboard-container {
      max-width: 800px;
      margin: 24px auto;
      padding: 0 20px;
    }

    .dash-section-label {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Pinned Trip Card */
    .pinned-card {
      background: linear-gradient(135deg, rgba(22, 26, 34, 0.95), rgba(30, 36, 48, 0.95));
      border: 1px solid var(--accent-coral);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 28px;
      box-shadow: 0 12px 32px rgba(255, 94, 87, 0.12);
      position: relative;
    }

    .pinned-badge {
      position: absolute;
      top: -12px;
      right: 20px;
      background: var(--accent-coral);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 12px;
      letter-spacing: 0.8px;
    }

    .pinned-title {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .pinned-sub {
      color: var(--text-muted);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .open-trip-btn {
      background: var(--accent-coral);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .open-trip-btn:hover {
      opacity: 0.9;
    }

    /* Trips Grid */
    .trips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .trip-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 130px;
    }

    .trip-card:hover {
      border-color: var(--accent-teal);
      transform: translateY(-2px);
    }

    .trip-card-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .trip-card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .add-trip-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--card-border);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.9rem;
      min-height: 130px;
      transition: all 0.2s ease;
    }

    .add-trip-card:hover {
      border-color: var(--accent-teal);
      color: var(--accent-teal);
      background: rgba(0, 210, 211, 0.04);
    }

    /* Travel Toolkit Dock */
    .toolkit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 12px;
    }

    .tool-link {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .tool-link:hover {
      border-color: var(--accent-amber);
      background: rgba(255, 159, 67, 0.05);
    }

    .tool-icon {
      color: var(--accent-amber);
    }

    /* Budget Dashboard Bar */
    .budget-bar {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .budget-card {
      background: linear-gradient(135deg, rgba(22, 26, 34, 0.9), rgba(30, 36, 48, 0.9));
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .stat-value {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .val-budget { color: var(--text-main); cursor: pointer; }
    .val-spent { color: var(--accent-coral); }
    .val-remain { color: var(--accent-teal); }

    /* Main Timeline Structure */
    .main-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
    }

    /* Vertical Timeline Spine */
    .main-container::before {
      content: '';
      position: absolute;
      left: 39px;
      top: 30px;
      bottom: 30px;
      width: 3px;
      background: linear-gradient(to bottom, var(--accent-coral), var(--accent-teal), var(--accent-amber));
      border-radius: 2px;
      z-index: 1;
    }

    .day-block {
      position: relative;
      margin-bottom: 36px;
      padding-left: 50px;
    }

    .day-node {
      position: absolute;
      left: 8px;
      top: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--bg);
      border: 4px solid var(--accent-coral);
      z-index: 2;
    }

    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .day-title-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .day-title {
      font-family: var(--font-heading);
      font-size: 1.3rem;
      font-weight: 700;
    }

    /* Compact Live Weather Badge */
    .weather-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 210, 211, 0.1);
      border: 1px solid rgba(0, 210, 211, 0.3);
      color: var(--accent-teal);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Anchor Items / Places */
    .anchor-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      transition: border-color 0.2s ease, transform 0.2s ease;
      position: relative;
    }

    .anchor-card.dragging {
      opacity: 0.5;
      border-color: var(--accent-amber);
    }

    .anchor-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .anchor-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .anchor-title {
      font-weight: 700;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drag-handle {
      cursor: grab;
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }

    .map-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--accent-amber);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(255, 159, 67, 0.1);
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    .map-link-btn:hover {
      background: rgba(255, 159, 67, 0.2);
    }

    /* Sub-sections inside anchor cards */
    .card-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .section-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Checklist Styling */
    .checklist {
      list-style: none;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .check-item input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid var(--text-muted);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }

    .check-item input[type="checkbox"]:checked {
      background-color: var(--accent-teal);
      border-color: var(--accent-teal);
    }

    .check-item input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: #000;
      font-size: 11px;
      font-weight: 900;
      top: -2px;
      left: 2px;
    }

    .check-item.done span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Transit and Notes */
    .note-box {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 12px;
      border-radius: 8px;
      border-left: 3px solid var(--accent-purple);
    }

    /* Quick Spend Logger Form */
    .spend-logger {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .spend-input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      width: 100px;
    }

    .spend-btn {
      background: var(--accent-coral);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Action Buttons for Adding & Editing */
    .add-location-btn, .add-day-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--card-border);
      color: var(--text-muted);
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
    }

    .add-location-btn:hover, .add-day-btn:hover {
      background: rgba(0, 210, 211, 0.05);
      border-color: var(--accent-teal);
      color: var(--accent-teal);
    }

    .action-icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .action-icon-btn:hover {
      color: var(--text-main);
    }

    /* Simple Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-input, .form-textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.9rem;
    }

    .form-textarea {
      resize: vertical;
      min-height: 60px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-save {
      background: var(--accent-teal);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .main-container::before { left: 24px; }
      .day-block { padding-left: 36px; }
      .day-node { left: -3px; }
    }
  </style>
</head>
<body>

  <!-- Header & Nav Bar -->
  <header>
    <div class="nav-container">
      <div class="logo" onclick="showDashboard()">
        <i data-lucide="compass"></i>
        <span>Rumbo</span>
      </div>
      <div class="nav-controls">
        <button class="back-btn" id="dashBackBtn" onclick="showDashboard()" style="display: none;">
          <i data-lucide="layout-dashboard"></i>
          <span data-i18n="dashboard">Dashboard</span>
        </button>
        <button class="mode-btn" id="modeToggle" onclick="toggleReadMode()" style="display: none;">
          <i data-lucide="eye" id="modeIcon"></i>
          <span id="modeText">Edit Mode</span>
        </button>
        <button class="lang-btn" id="langToggle" onclick="toggleLanguage()">
          <i data-lucide="globe"></i>
          <span id="langText">ES</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Homepage Dashboard View -->
  <div id="dashboardView" class="dashboard-container">
    
    <!-- Pinned Trip -->
    <div class="dash-section-label">
      <i data-lucide="pin" size="14" style="color:var(--accent-coral)"></i>
      <span data-i18n="pinnedTrip">Pinned Active Trip</span>
    </div>

    <div class="pinned-card" id="pinnedCard">
      <!-- Dynamically filled in JS -->
    </div>

    <!-- All Saved Trips -->
    <div class="dash-section-label">
      <i data-lucide="map" size="14" style="color:var(--accent-teal)"></i>
      <span data-i18n="myTrips">My Saved Trips</span>
    </div>

    <div class="trips-grid" id="tripsGrid">
      <!-- Dynamically filled in JS -->
    </div>

    <!-- Travel Toolkit -->
    <div class="dash-section-label">
      <i data-lucide="briefcase" size="14" style="color:var(--accent-amber)"></i>
      <span data-i18n="travelToolkit">Travel Companion Apps</span>
    </div>

    <div class="toolkit-grid">
      <a href="https://maps.google.com" target="_blank" class="tool-link">
        <i data-lucide="map-pin" class="tool-icon"></i>
        <span>Google Maps</span>
      </a>
      <a href="https://www.airbnb.com" target="_blank" class="tool-link">
        <i data-lucide="home" class="tool-icon"></i>
        <span>Airbnb</span>
      </a>
      <a href="https://www.google.com/travel/flights" target="_blank" class="tool-link">
        <i data-lucide="plane" class="tool-icon"></i>
        <span>Google Flights</span>
      </a>
      <a href="https://translate.google.com" target="_blank" class="tool-link">
        <i data-lucide="languages" class="tool-icon"></i>
        <span>Translate</span>
      </a>
      <a href="https://www.xe.com" target="_blank" class="tool-link">
        <i data-lucide="dollar-sign" class="tool-icon"></i>
        <span>XE Currency</span>
      </a>
    </div>
  </div>

  <!-- Detailed Trip Itinerary View (Initially Hidden) -->
  <div id="itineraryView" style="display: none;">
    <!-- Sticky Budget Bar -->
    <div class="budget-bar">
      <div class="budget-card">
        <div class="stat-item">
          <span class="stat-label" data-i18n="totalBudget">Total Budget</span>
          <span class="stat-value val-budget" id="displayBudget" onclick="promptEditBudget()">$1,500</span>
        </div>
        <div class="stat-item">
          <span class="stat-label" data-i18n="totalSpent">Total Spent</span>
          <span class="stat-value val-spent" id="displaySpent">$0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label" data-i18n="remaining">Remaining</span>
          <span class="stat-value val-remain" id="displayRemain">$1,500</span>
        </div>
      </div>
    </div>

    <!-- Main Vertical Timeline -->
    <main class="main-container" id="timeline">
      <!-- Days and Entries dynamically rendered via JS -->
    </main>
  </div>

  <!-- Modal Container for Location Form -->
  <div id="modalOverlay" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalTitle">Add Location</span>
        <button class="action-icon-btn" onclick="closeModal()"><i data-lucide="x"></i></button>
      </div>
      <form id="locationForm" onsubmit="saveLocation(event)">
        <input type="hidden" id="formDayId">
        <input type="hidden" id="formAnchorId">
        
        <div class="form-group">
          <label class="form-label">Location / Area Title</label>
          <input type="text" id="formTitle" class="form-input" placeholder="e.g. Palacio de Bellas Artes" required>
        </div>

        <div class="form-group">
          <label class="form-label">Google Maps Link</label>
          <input type="url" id="formMapUrl" class="form-input" placeholder="https://maps.google.com/?q=...">
        </div>

        <div class="form-group">
          <label class="form-label">Checklist Items (Comma separated)</label>
          <input type="text" id="formChecklist" class="form-input" placeholder="Buy tickets early, Camera permit">
        </div>

        <div class="form-group">
          <label class="form-label">Spots & Eats (Prefix non-food with [spot] e.g. [spot] Soumaya Museum, Café Tacuba)</label>
          <input type="text" id="formFood" class="form-input" placeholder="Café Tacuba, [spot] Alameda Central Park">
        </div>

        <div class="form-group">
          <label class="form-label">Transit & Notes</label>
          <textarea id="formNotes" class="form-textarea" placeholder="Take Metro Line 2..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-save">Save Location</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Container for New Trip Form -->
  <div id="newTripModalOverlay" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <span>Create New Trip</span>
        <button class="action-icon-btn" onclick="closeNewTripModal()"><i data-lucide="x"></i></button>
      </div>
      <form onsubmit="createNewTrip(event)">
        <div class="form-group">
          <label class="form-label">Trip Title</label>
          <input type="text" id="newTripTitle" class="form-input" placeholder="e.g. Tokyo 10 Day Exploration" required>
        </div>
        <div class="form-group">
          <label class="form-label">Total Budget ($)</label>
          <input type="number" id="newTripBudget" class="form-input" placeholder="2000" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeNewTripModal()">Cancel</button>
          <button type="submit" class="btn-save">Create Trip</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const i18n = {
      en: {
        dashboard: "Dashboard",
        pinnedTrip: "Pinned Active Trip",
        myTrips: "My Saved Trips",
        travelToolkit: "Travel Companion Apps",
        openTrip: "Open Itinerary",
        newTrip: "Create New Trip",
        totalBudget: "Total Budget",
        totalSpent: "Total Spent",
        remaining: "Remaining",
        editMode: "Edit Mode",
        viewMode: "View Only",
        mapLink: "Map",
        mustTry: "Spots & Eats",
        logistics: "Transit & Notes",
        addExpense: "Log Spend",
        spendPlaceholder: "$ Amount",
        addBtn: "Add",
        weatherLoading: "Checking weather...",
        addLocation: "Add Location",
        addDay: "Add New Day"
      },
      es: {
        dashboard: "Panel Base",
        pinnedTrip: "Viaje Fijado Principal",
        myTrips: "Mis Viajes Guardados",
        travelToolkit: "Herramientas de Viaje",
        openTrip: "Abrir Itinerario",
        newTrip: "Crear Nuevo Viaje",
        totalBudget: "Presupuesto Total",
        totalSpent: "Total Gastado",
        remaining: "Restante",
        editMode: "Modo Edición",
        viewMode: "Solo Lectura",
        mapLink: "Mapa",
        mustTry: "Lugares y Comida",
        logistics: "Tránsito y Notas",
        addExpense: "Registrar Gasto",
        spendPlaceholder: "$ Monto",
        addBtn: "Añadir",
        weatherLoading: "Consultando clima...",
        addLocation: "Añadir Lugar",
        addDay: "Añadir Nuevo Día"
      }
    };

    let currentLang = 'en';
    let isReadOnly = false;
    let draggedItem = null;
    let activeTripId = 1;

    let appData = {
      pinnedTripId: 1,
      trips: [
        {
          id: 1,
          name: "Mexico City 7 Day Trip",
          daysCount: 7,
          budget: 1500,
          spent: 120,
          days: [
            {
              id: 1,
              customTitleEn: "Arrival & Historic Center",
              customTitleEs: "Llegada y Centro Histórico",
              lat: 19.4326,
              lon: -99.1332,
              weather: "22°C Clear",
              anchors: [
                {
                  id: "a1",
                  title: "Palacio de Bellas Artes",
                  mapUrl: "https://maps.google.com/?q=Palacio+de+Bellas+Artes",
                  checklist: [
                    { text: "Buy tickets for murals deck", done: true },
                    { text: "Photo stop at Alameda Central", done: false }
                  ],
                  food: [
                    { name: "Café Tacuba (Lunch)", type: "food" },
                    { name: "Churrería El Moro", type: "food" },
                    { name: "Alameda Central Walk", type: "spot" }
                  ],
                  notes: "Take Metro Line 2 to Bellas Artes. Exit Gate 3."
                }
              ]
            },
            {
              id: 2,
              customTitleEn: "Coyoacán & Frida Kahlo Museum",
              customTitleEs: "Coyoacán y Museo Frida Kahlo",
              lat: 19.3497,
              lon: -99.1625,
              weather: "20°C Clouds",
              anchors: [
                {
                  id: "a2",
                  title: "Museo Frida Kahlo (Casa Azul)",
                  mapUrl: "https://maps.google.com/?q=Museo+Frida+Kahlo",
                  checklist: [
                    { text: "Arrive 15 min early for security line", done: false },
                    { text: "Camera permit fee at entrance", done: false }
                  ],
                  food: [
                    { name: "Tacos de Coyoacán", type: "food" },
                    { name: "Mercado de Coyoacán tostadas", type: "food" }
                  ],
                  notes: "Uber from stay takes ~25 mins depending on traffic."
                }
              ]
            }
          ]
        }
      ]
    };

    function initApp() {
      const saved = localStorage.getItem('rumbo_app_data');
      if (saved) {
        appData = JSON.parse(saved);
      }
      showDashboard();
    }

    function saveState() {
      localStorage.setItem('rumbo_app_data', JSON.stringify(appData));
    }

    function showDashboard() {
      document.getElementById('dashboardView').style.display = 'block';
      document.getElementById('itineraryView').style.display = 'none';
      document.getElementById('dashBackBtn').style.display = 'none';
      document.getElementById('modeToggle').style.display = 'none';
      renderDashboard();
    }

    function openTrip(tripId) {
      activeTripId = tripId;
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('itineraryView').style.display = 'block';
      document.getElementById('dashBackBtn').style.display = 'flex';
      document.getElementById('modeToggle').style.display = 'flex';
      renderItinerary();
      fetchRealTimeWeather();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'es' : 'en';
      document.getElementById('langText').innerText = currentLang.toUpperCase();
      if (document.getElementById('dashboardView').style.display !== 'none') {
        renderDashboard();
      } else {
        renderItinerary();
      }
    }

    function toggleReadMode() {
      isReadOnly = !isReadOnly;
      document.getElementById('modeText').innerText = isReadOnly ? i18n[currentLang].viewMode : i18n[currentLang].editMode;
      document.getElementById('modeIcon').setAttribute('data-lucide', isReadOnly ? 'eye-off' : 'eye');
      renderItinerary();
    }

    // --- Dashboard Renderers ---
    function renderDashboard() {
      const t = i18n[currentLang];

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerText = t[key];
      });

      // Pinned Trip Card
      const pinnedTrip = appData.trips.find(tr => tr.id === appData.pinnedTripId) || appData.trips[0];
      const pinnedEl = document.getElementById('pinnedCard');
      pinnedEl.innerHTML = `
        <span class="pinned-badge">PINNED</span>
        <div class="pinned-title">${pinnedTrip.name}</div>
        <div class="pinned-sub">
          <span><i data-lucide="calendar" size="14"></i> ${pinnedTrip.days.length} Days</span>
          <span><i data-lucide="wallet" size="14"></i> $${pinnedTrip.budget} Budget</span>
        </div>
        <button class="open-trip-btn" onclick="openTrip(${pinnedTrip.id})">
          <i data-lucide="arrow-right-circle" size="18"></i> ${t.openTrip}
        </button>
      `;

      // Saved Trips Grid
      const tripsGrid = document.getElementById('tripsGrid');
      let gridHtml = appData.trips.map(tr => `
        <div class="trip-card" onclick="openTrip(${tr.id})">
          <div>
            <div class="trip-card-title">${tr.name}</div>
            <div class="trip-card-meta">${tr.days.length} Days • $${tr.budget}</div>
          </div>
          <div style="font-size: 0.75rem; color: var(--accent-teal); font-weight:700; margin-top:12px;">
            ${t.openTrip} →
          </div>
        </div>
      `).join('');

      gridHtml += `
        <div class="add-trip-card" onclick="openNewTripModal()">
          <i data-lucide="plus-circle" size="24"></i>
          <span>${t.newTrip}</span>
        </div>
      `;

      tripsGrid.innerHTML = gridHtml;
      lucide.createIcons();
    }

    function openNewTripModal() {
      document.getElementById('newTripModalOverlay').style.display = 'flex';
    }

    function closeNewTripModal() {
      document.getElementById('newTripModalOverlay').style.display = 'none';
    }

    function createNewTrip(e) {
      e.preventDefault();
      const title = document.getElementById('newTripTitle').value;
      const budget = parseFloat(document.getElementById('newTripBudget').value) || 1000;

      const newId = Date.now();
      appData.trips.push({
        id: newId,
        name: title,
        budget: budget,
        spent: 0,
        days: [
          {
            id: Date.now(),
            customTitleEn: "",
            customTitleEs: "",
            lat: 19.4326,
            lon: -99.1332,
            weather: "20°C Clear",
            anchors: []
          }
        ]
      });

      saveState();
      closeNewTripModal();
      openTrip(newId);
    }

    // --- Itinerary Logic ---
    function getActiveTrip() {
      return appData.trips.find(tr => tr.id === activeTripId);
    }

    function promptEditBudget() {
      if (isReadOnly) return;
      const trip = getActiveTrip();
      const newBudget = prompt("Enter total trip budget ($):", trip.budget);
      if (newBudget !== null) {
        const val = parseFloat(newBudget);
        if (!isNaN(val) && val >= 0) {
          trip.budget = val;
          saveState();
          renderItinerary();
        }
      }
    }

    function logExpense(amount) {
      const parsed = parseFloat(amount);
      if (!isNaN(parsed) && parsed > 0) {
        const trip = getActiveTrip();
        trip.spent += parsed;
        saveState();
        renderItinerary();
      }
    }

    function toggleCheck(dayId, anchorId, checkIdx) {
      if (isReadOnly) return;
      const trip = getActiveTrip();
      const day = trip.days.find(d => d.id === dayId);
      if (day) {
        const anchor = day.anchors.find(a => a.id === anchorId);
        if (anchor && anchor.checklist[checkIdx]) {
          anchor.checklist[checkIdx].done = !anchor.checklist[checkIdx].done;
          saveState();
          renderItinerary();
        }
      }
    }

    function openAddModal(dayId) {
      document.getElementById('formDayId').value = dayId;
      document.getElementById('formAnchorId').value = '';
      document.getElementById('modalTitle').innerText = "Add Location";
      document.getElementById('locationForm').reset();
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function openEditModal(dayId, anchorId) {
      const trip = getActiveTrip();
      const day = trip.days.find(d => d.id === dayId);
      const anchor = day.anchors.find(a => a.id === anchorId);
      if (!anchor) return;

      document.getElementById('formDayId').value = dayId;
      document.getElementById('formAnchorId').value = anchorId;
      document.getElementById('modalTitle').innerText = "Edit Location";
      document.getElementById('formTitle').value = anchor.title;
      document.getElementById('formMapUrl').value = anchor.mapUrl || '';
      document.getElementById('formChecklist').value = anchor.checklist.map(c => c.text).join(', ');
      document.getElementById('formFood').value = anchor.food.map(f => (f.type === 'spot' ? `[spot] ${f.name}` : f.name)).join(', ');
      document.getElementById('formNotes').value = anchor.notes || '';

      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    function saveLocation(e) {
      e.preventDefault();
      const dayId = parseInt(document.getElementById('formDayId').value);
      const anchorId = document.getElementById('formAnchorId').value;
      const title = document.getElementById('formTitle').value;
      const mapUrl = document.getElementById('formMapUrl').value;
      const rawCheck = document.getElementById('formChecklist').value;
      const rawFood = document.getElementById('formFood').value;
      const notes = document.getElementById('formNotes').value;

      const checklist = rawCheck.split(',').filter(s => s.trim()).map(text => ({ text: text.trim(), done: false }));
      const food = rawFood.split(',').filter(s => s.trim()).map(item => {
        let trimmed = item.trim();
        if (trimmed.toLowerCase().startsWith('[spot]')) {
          return { name: trimmed.replace(/\[spot\]/i, '').trim(), type: 'spot' };
        }
        return { name: trimmed, type: 'food' };
      });

      const trip = getActiveTrip();
      const day = trip.days.find(d => d.id === dayId);
      if (day) {
        if (anchorId) {
          const anchor = day.anchors.find(a => a.id === anchorId);
          anchor.title = title;
          anchor.mapUrl = mapUrl;
          anchor.checklist = checklist;
          anchor.food = food;
          anchor.notes = notes;
        } else {
          day.anchors.push({
            id: 'a_' + Date.now(),
            title, mapUrl, checklist, food, notes
          });
        }
        saveState();
        closeModal();
        renderItinerary();
      }
    }

    function deleteAnchor(dayId, anchorId) {
      if (isReadOnly) return;
      if (confirm("Delete this location?")) {
        const trip = getActiveTrip();
        const day = trip.days.find(d => d.id === dayId);
        if (day) {
          day.anchors = day.anchors.filter(a => a.id !== anchorId);
          saveState();
          renderItinerary();
        }
      }
    }

    function editDayTitle(dayId) {
      if (isReadOnly) return;
      const trip = getActiveTrip();
      const day = trip.days.find(d => d.id === dayId);
      if (!day) return;

      const currentTitle = currentLang === 'en' ? (day.customTitleEn || '') : (day.customTitleEs || '');
      const newTitle = prompt("Add or change title for this day (leave blank for just 'Day X'):", currentTitle);

      if (newTitle !== null) {
        if (currentLang === 'en') {
          day.customTitleEn = newTitle.trim();
        } else {
          day.customTitleEs = newTitle.trim();
        }
        saveState();
        renderItinerary();
      }
    }

    function deleteDay(dayId) {
      if (isReadOnly) return;
      if (confirm("Are you sure you want to delete this entire day?")) {
        const trip = getActiveTrip();
        trip.days = trip.days.filter(d => d.id !== dayId);
        saveState();
        renderItinerary();
      }
    }

    function addNewDay() {
      if (isReadOnly) return;
      const trip = getActiveTrip();
      trip.days.push({
        id: Date.now(),
        customTitleEn: "",
        customTitleEs: "",
        lat: 19.4326,
        lon: -99.1332,
        weather: "20°C Clear",
        anchors: []
      });
      saveState();
      renderItinerary();
    }

    // Drag and Drop
    function handleDragStart(e, dayId, index) {
      if (isReadOnly) return;
      draggedItem = { dayId, index };
      e.target.classList.add('dragging');
    }

    function handleDragOver(e) {
      e.preventDefault();
    }

    function handleDrop(e, targetDayId, targetIndex) {
      e.preventDefault();
      if (!draggedItem || draggedItem.dayId !== targetDayId) return;
      
      const trip = getActiveTrip();
      const day = trip.days.find(d => d.id === targetDayId);
      const movedItem = day.anchors.splice(draggedItem.index, 1)[0];
      day.anchors.splice(targetIndex, 0, movedItem);

      draggedItem = null;
      saveState();
      renderItinerary();
    }

    async function fetchRealTimeWeather() {
      const trip = getActiveTrip();
      if (!trip) return;

      for (let day of trip.days) {
        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${day.lat}&longitude=${day.lon}&current_weather=true`);
          const data = await res.json();
          if (data && data.current_weather) {
            const temp = Math.round(data.current_weather.temperature);
            day.weather = `${temp}°C Live`;
          }
        } catch (e) {
          console.warn("Weather fetch fallback", e);
        }
      }
      renderItinerary();
    }

    function renderItinerary() {
      const t = i18n[currentLang];
      const trip = getActiveTrip();
      if (!trip) return;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerText = t[key];
      });

      document.getElementById('displayBudget').innerText = `$${trip.budget}`;
      document.getElementById('displaySpent').innerText = `$${trip.spent}`;
      const remain = trip.budget - trip.spent;
      const remainEl = document.getElementById('displayRemain');
      remainEl.innerText = `$${remain}`;
      remainEl.style.color = remain < 0 ? 'var(--accent-coral)' : 'var(--accent-teal)';

      const timelineEl = document.getElementById('timeline');
      timelineEl.innerHTML = '';

      trip.days.forEach((day, index) => {
        const dayNumberLabel = currentLang === 'en' ? `Day ${index + 1}` : `Día ${index + 1}`;
        const customTitle = currentLang === 'en' ? day.customTitleEn : day.customTitleEs;
        const fullDayTitle = customTitle ? `${dayNumberLabel} - ${customTitle}` : dayNumberLabel;

        let anchorsHtml = day.anchors.map((anchor, aIndex) => {
          let checklistHtml = anchor.checklist.map((item, idx) => `
            <li class="check-item ${item.done ? 'done' : ''}">
              <input type="checkbox" ${item.done ? 'checked' : ''} ${isReadOnly ? 'disabled' : ''} onclick="toggleCheck(${day.id}, '${anchor.id}', ${idx})">
              <span>${item.text}</span>
            </li>
          `).join('');

          let foodHtml = anchor.food.map(f => {
            const iconName = f.type === 'spot' ? 'landmark' : 'utensils';
            return `<div class="check-item"><i data-lucide="${iconName}" size="14"></i> ${f.name}</div>`;
          }).join('');

          return `
            <div class="anchor-card" 
                 draggable="${!isReadOnly}" 
                 ondragstart="handleDragStart(event, ${day.id}, ${aIndex})"
                 ondragover="handleDragOver(event)"
                 ondrop="handleDrop(event, ${day.id}, ${aIndex})">
              
              <div class="anchor-top">
                <span class="anchor-title">
                  ${!isReadOnly ? `<span class="drag-handle"><i data-lucide="grip-vertical" size="16"></i></span>` : ''}
                  <i data-lucide="map-pin" size="18" style="color:var(--accent-coral)"></i> 
                  ${anchor.title}
                </span>
                
                <div style="display:flex; gap:8px; align-items:center;">
                  ${anchor.mapUrl ? `
                    <a href="${anchor.mapUrl}" target="_blank" rel="noopener" class="map-link-btn">
                      <i data-lucide="navigation" size="12"></i> ${t.mapLink}
                    </a>
                  ` : ''}
                  ${!isReadOnly ? `
                    <button class="action-icon-btn" onclick="openEditModal(${day.id}, '${anchor.id}')"><i data-lucide="pencil" size="14"></i></button>
                    <button class="action-icon-btn" onclick="deleteAnchor(${day.id}, '${anchor.id}')"><i data-lucide="trash-2" size="14"></i></button>
                  ` : ''}
                </div>
              </div>
              
              ${anchor.checklist.length ? `
                <div class="card-section">
                  <ul class="checklist">${checklistHtml}</ul>
                </div>
              ` : ''}

              ${anchor.food.length ? `
                <div class="card-section">
                  <span class="section-label"><i data-lucide="compass" size="12"></i> ${t.mustTry}</span>
                  ${foodHtml}
                </div>
              ` : ''}

              ${anchor.notes ? `
                <div class="card-section">
                  <span class="section-label"><i data-lucide="info" size="12"></i> ${t.logistics}</span>
                  <div class="note-box">${anchor.notes}</div>
                </div>
              ` : ''}

              ${!isReadOnly ? `
                <div class="card-section">
                  <div class="spend-logger">
                    <input type="number" id="spend-${anchor.id}" class="spend-input" placeholder="${t.spendPlaceholder}">
                    <button class="spend-btn" onclick="logExpense(document.getElementById('spend-${anchor.id}').value)">${t.addBtn}</button>
                  </div>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');

        const dayHtml = `
          <div class="day-block">
            <div class="day-node"></div>
            <div class="day-header">
              <div class="day-title-container">
                <span class="day-title">${fullDayTitle}</span>
                ${!isReadOnly ? `
                  <button class="action-icon-btn" onclick="editDayTitle(${day.id})" title="Edit Day Title"><i data-lucide="pencil" size="14"></i></button>
                  <button class="action-icon-btn" onclick="deleteDay(${day.id})" title="Delete Day"><i data-lucide="trash-2" size="14"></i></button>
                ` : ''}
              </div>
              <span class="weather-badge"><i data-lucide="cloud-sun" size="14"></i> ${day.weather || t.weatherLoading}</span>
            </div>
            ${anchorsHtml}
            ${!isReadOnly ? `
              <button class="add-location-btn" onclick="openAddModal(${day.id})">
                <i data-lucide="plus-circle" size="18"></i> ${t.addLocation}
              </button>
            ` : ''}
          </div>
        `;

        timelineEl.innerHTML += dayHtml;
      });

      if (!isReadOnly) {
        timelineEl.innerHTML += `
          <button class="add-day-btn" onclick="addNewDay()">
            <i data-lucide="plus" size="20"></i> ${t.addDay}
          </button>
        `;
      }

      lucide.createIcons();
    }

    window.onload = initApp;
  </script>
</body>
</html>
