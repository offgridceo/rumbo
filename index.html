<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rumbo — Itinerary & Trip Organizer</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #161a22;
      --card-border: #262c3a;
      --accent-coral: #ff5e57;
      --accent-teal: #00d2d3;
      --accent-amber: #ff9f43;
      --accent-purple: #5f27cd;
      --text-main: #f1f2f6;
      --text-muted: #8c9baf;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.5;
      padding-bottom: 80px;
    }

    /* Sticky Navigation Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 15, 18, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 20px;
    }

    .nav-container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-coral);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.5px;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lang-btn, .mode-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .lang-btn:hover, .mode-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-teal);
    }

    /* Budget Dashboard Bar */
    .budget-bar {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .budget-card {
      background: linear-gradient(135deg, rgba(22, 26, 34, 0.9), rgba(30, 36, 48, 0.9));
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .stat-value {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .val-budget { color: var(--text-main); }
    .val-spent { color: var(--accent-coral); }
    .val-remain { color: var(--accent-teal); }

    /* Main Timeline Structure */
    .main-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
    }

    /* Vertical Timeline Spine */
    .main-container::before {
      content: '';
      position: absolute;
      left: 39px;
      top: 30px;
      bottom: 30px;
      width: 3px;
      background: linear-gradient(to bottom, var(--accent-coral), var(--accent-teal), var(--accent-amber));
      border-radius: 2px;
      z-index: 1;
    }

    .day-block {
      position: relative;
      margin-bottom: 36px;
      padding-left: 50px;
    }

    .day-node {
      position: absolute;
      left: 8px;
      top: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--bg);
      border: 4px solid var(--accent-coral);
      z-index: 2;
    }

    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .day-title {
      font-family: var(--font-heading);
      font-size: 1.3rem;
      font-weight: 700;
    }

    /* Compact Live Weather Badge */
    .weather-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 210, 211, 0.1);
      border: 1px solid rgba(0, 210, 211, 0.3);
      color: var(--accent-teal);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Anchor Items / Places */
    .anchor-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      transition: border-color 0.2s ease;
    }

    .anchor-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .anchor-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .anchor-title {
      font-weight: 700;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .map-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--accent-amber);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(255, 159, 67, 0.1);
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    .map-link-btn:hover {
      background: rgba(255, 159, 67, 0.2);
    }

    /* Sub-sections inside anchor cards */
    .card-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .section-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Checklist Styling */
    .checklist {
      list-style: none;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .check-item input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid var(--text-muted);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }

    .check-item input[type="checkbox"]:checked {
      background-color: var(--accent-teal);
      border-color: var(--accent-teal);
    }

    .check-item input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: #000;
      font-size: 11px;
      font-weight: 900;
      top: -2px;
      left: 2px;
    }

    .check-item.done span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Transit and Notes */
    .note-box {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 12px;
      border-radius: 8px;
      border-left: 3px solid var(--accent-purple);
    }

    /* Quick Spend Logger Form */
    .spend-logger {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .spend-input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      width: 100px;
    }

    .spend-btn {
      background: var(--accent-coral);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Responsive adjustment */
    @media (max-width: 600px) {
      .main-container::before { left: 24px; }
      .day-block { padding-left: 36px; }
      .day-node { left: -3px; }
    }
  </style>
</head>
<body>

  <!-- Header & Nav Bar -->
  <header>
    <div class="nav-container">
      <div class="logo">
        <i data-lucide="compass"></i>
        <span>Rumbo</span>
      </div>
      <div class="nav-controls">
        <button class="mode-btn" id="modeToggle" onclick="toggleReadMode()">
          <i data-lucide="eye"></i>
          <span id="modeText">Edit Mode</span>
        </button>
        <button class="lang-btn" id="langToggle" onclick="toggleLanguage()">
          <i data-lucide="globe"></i>
          <span id="langText">ES</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Sticky Budget Bar -->
  <div class="budget-bar">
    <div class="budget-card">
      <div class="stat-item">
        <span class="stat-label" data-i18n="totalBudget">Total Budget</span>
        <span class="stat-value val-budget" id="displayBudget">$1,500</span>
      </div>
      <div class="stat-item">
        <span class="stat-label" data-i18n="totalSpent">Total Spent</span>
        <span class="stat-value val-spent" id="displaySpent">$0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label" data-i18n="remaining">Remaining</span>
        <span class="stat-value val-remain" id="displayRemain">$1,500</span>
      </div>
    </div>
  </div>

  <!-- Main Vertical Timeline -->
  <main class="main-container" id="timeline">
    <!-- Days and Entries dynamically rendered via JS -->
  </main>

  <script>
    // --- Translations Dictionary ---
    const i18n = {
      en: {
        totalBudget: "Total Budget",
        totalSpent: "Total Spent",
        remaining: "Remaining",
        editMode: "Edit Mode",
        viewMode: "View Only",
        mapLink: "Map",
        mustTry: "Spots & Eats",
        logistics: "Transit & Notes",
        addExpense: "Log Spend",
        spendPlaceholder: "$ Amount",
        addBtn: "Add",
        weatherLoading: "Checking weather..."
      },
      es: {
        totalBudget: "Presupuesto Total",
        totalSpent: "Total Gastado",
        remaining: "Restante",
        editMode: "Modo Edición",
        viewMode: "Solo Lectura",
        mapLink: "Mapa",
        mustTry: "Lugares y Comida",
        logistics: "Tránsito y Notas",
        addExpense: "Registrar Gasto",
        spendPlaceholder: "$ Monto",
        addBtn: "Añadir",
        weatherLoading: "Consultando clima..."
      }
    };

    let currentLang = 'en';
    let isReadOnly = false;

    // --- Sample Itinerary State ---
    let tripData = {
      budget: 1500,
      spent: 120,
      days: [
        {
          id: 1,
          titleEn: "Day 1 - Arrival & Historic Center",
          titleEs: "Día 1 - Llegada y Centro Histórico",
          lat: 19.4326,
          lon: -99.1332, // Mexico City CDMX coordinates
          weather: "22°C Clear",
          anchors: [
            {
              id: "a1",
              title: "Palacio de Bellas Artes",
              mapUrl: "https://maps.google.com/?q=Palacio+de+Bellas+Artes",
              checklist: [
                { text: "Buy tickets for murals deck", done: true },
                { text: "Photo stop at Alameda Central", done: false }
              ],
              food: ["Café Tacuba (Lunch)", "Churrería El Moro"],
              notes: "Take Metro Line 2 to Bellas Artes. Exit Gate 3."
            }
          ]
        },
        {
          id: 2,
          titleEn: "Day 2 - Coyoacán & Frida Kahlo Museum",
          titleEs: "Día 2 - Coyoacán y Museo Frida Kahlo",
          lat: 19.3497,
          lon: -99.1625,
          weather: "20°C Clouds",
          anchors: [
            {
              id: "a2",
              title: "Museo Frida Kahlo (Casa Azul)",
              mapUrl: "https://maps.google.com/?q=Museo+Frida+Kahlo",
              checklist: [
                { text: "Arrive 15 min early for security line", done: false },
                { text: "Camera permit fee at entrance", done: false }
              ],
              food: ["Tacos de Coyoacán", "Mercado de Coyoacán tostadas"],
              notes: "Uber from stay takes ~25 mins depending on traffic."
            }
          ]
        }
      ]
    };

    // --- Core Functions ---

    function initApp() {
      // Load stored state if available
      const saved = localStorage.getItem('rumbo_data');
      if (saved) {
        tripData = JSON.parse(saved);
      }
      render();
      fetchRealTimeWeather();
      lucide.createIcons();
    }

    function saveState() {
      localStorage.setItem('rumbo_data', JSON.stringify(tripData));
    }

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'es' : 'en';
      document.getElementById('langText').innerText = currentLang.toUpperCase();
      render();
    }

    function toggleReadMode() {
      isReadOnly = !isReadOnly;
      const btnText = document.getElementById('modeText');
      btnText.innerText = isReadOnly ? i18n[currentLang].viewMode : i18n[currentLang].editMode;
      render();
    }

    function logExpense(amount) {
      const parsed = parseFloat(amount);
      if (!isNaN(parsed) && parsed > 0) {
        tripData.spent += parsed;
        saveState();
        render();
      }
    }

    function toggleCheck(dayId, anchorId, checkIdx) {
      if (isReadOnly) return;
      const day = tripData.days.find(d => d.id === dayId);
      if (day) {
        const anchor = day.anchors.find(a => a.id === anchorId);
        if (anchor && anchor.checklist[checkIdx]) {
          anchor.checklist[checkIdx].done = !anchor.checklist[checkIdx].done;
          saveState();
          render();
        }
      }
    }

    // Live Weather via Open-Meteo API (No Key Required)
    async function fetchRealTimeWeather() {
      for (let day of tripData.days) {
        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${day.lat}&longitude=${day.lon}&current_weather=true`);
          const data = await res.json();
          if (data && data.current_weather) {
            const temp = Math.round(data.current_weather.temperature);
            day.weather = `${temp}°C Live`;
          }
        } catch (e) {
          console.warn("Weather fetch fallback", e);
        }
      }
      render();
    }

    function render() {
      const t = i18n[currentLang];

      // Translate static UI strings
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerText = t[key];
      });

      // Render Dashboard
      document.getElementById('displayBudget').innerText = `$${tripData.budget}`;
      document.getElementById('displaySpent').innerText = `$${tripData.spent}`;
      const remain = tripData.budget - tripData.spent;
      const remainEl = document.getElementById('displayRemain');
      remainEl.innerText = `$${remain}`;
      remainEl.style.color = remain < 0 ? 'var(--accent-coral)' : 'var(--accent-teal)';

      // Render Timeline
      const timelineEl = document.getElementById('timeline');
      timelineEl.innerHTML = '';

      tripData.days.forEach(day => {
        const dayTitle = currentLang === 'en' ? day.titleEn : day.titleEs;
        
        let anchorsHtml = day.anchors.map(anchor => {
          let checklistHtml = anchor.checklist.map((item, idx) => `
            <li class="check-item ${item.done ? 'done' : ''}">
              <input type="checkbox" ${item.done ? 'checked' : ''} ${isReadOnly ? 'disabled' : ''} onclick="toggleCheck(${day.id}, '${anchor.id}', ${idx})">
              <span>${item.text}</span>
            </li>
          `).join('');

          let foodHtml = anchor.food.map(f => `<div class="check-item"><i data-lucide="utensils" size="14"></i> ${f}</div>`).join('');

          return `
            <div class="anchor-card">
              <div class="anchor-top">
                <span class="anchor-title"><i data-lucide="map-pin" size="18" style="color:var(--accent-coral)"></i> ${anchor.title}</span>
                <a href="${anchor.mapUrl}" target="_blank" rel="noopener" class="map-link-btn">
                  <i data-lucide="navigation" size="12"></i> ${t.mapLink}
                </a>
              </div>
              
              <div class="card-section">
                <ul class="checklist">${checklistHtml}</ul>
              </div>

              ${anchor.food.length ? `
                <div class="card-section">
                  <span class="section-label"><i data-lucide="coffee" size="12"></i> ${t.mustTry}</span>
                  ${foodHtml}
                </div>
              ` : ''}

              ${anchor.notes ? `
                <div class="card-section">
                  <span class="section-label"><i data-lucide="info" size="12"></i> ${t.logistics}</span>
                  <div class="note-box">${anchor.notes}</div>
                </div>
              ` : ''}

              ${!isReadOnly ? `
                <div class="card-section">
                  <div class="spend-logger">
                    <input type="number" id="spend-${anchor.id}" class="spend-input" placeholder="${t.spendPlaceholder}">
                    <button class="spend-btn" onclick="logExpense(document.getElementById('spend-${anchor.id}').value)">${t.addBtn}</button>
                  </div>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');

        const dayHtml = `
          <div class="day-block">
            <div class="day-node"></div>
            <div class="day-header">
              <span class="day-title">${dayTitle}</span>
              <span class="weather-badge"><i data-lucide="cloud-sun" size="14"></i> ${day.weather || t.weatherLoading}</span>
            </div>
            ${anchorsHtml}
          </div>
        `;

        timelineEl.innerHTML += dayHtml;
      });

      lucide.createIcons();
    }

    // Initialize application on page load
    window.onload = initApp;
  </script>
</body>
</html>
